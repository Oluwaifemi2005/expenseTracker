<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Deep Navy / Obsidian Fintech Canvas Gradient -->
    <linearGradient id="vaultex-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <!-- Crisp Emerald Growth Accent Gradient -->
    <linearGradient id="vaultex-emerald" x1="16" y1="8.5" x2="25" y2="23.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas matching Vaultex Brand Badge Geometry -->
  <rect width="32" height="32" rx="7.5" fill="url(#vaultex-bg)"/>
  
  <!-- Subtle High-Contrast Perimeter Rim for Dark & Light Browser Tabs -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="#1E293B" stroke-width="1"/>

  <!-- Unified Base "V": Left Structural Anchor (Crisp Pure White) -->
  <path d="M7 8.5H11.5L16 16L20.5 8.5H25L16 23.5Z" fill="#FFFFFF"/>

  <!-- Right Trajectory Wing: Financial Control & Growth (Emerald Accent) -->
  <path d="M16 16L20.5 8.5H25L16 23.5Z" fill="url(#vaultex-emerald)"/>
</svg>